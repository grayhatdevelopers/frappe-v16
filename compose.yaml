x-app: &app
  image: '${APP_IMAGE:?APP_IMAGE must be an immutable image tag or digest}'
  pull_policy: always
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-job: &job
  image: '${APP_IMAGE:?APP_IMAGE must be an immutable image tag or digest}'
  pull_policy: always
  restart: 'no'
  # exclude_from_hc: true
  entrypoint: [bash, -c]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: '${DB_IMAGE:?DB_IMAGE is required}'
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 2m
    deploy:
      mode: replicated
      replicas: '${ENABLE_DB:?Set ENABLE_DB to 0 for an external database or 1 for the Compose database}'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
      MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
      MARIADB_AUTO_UPGRADE: '${MARIADB_AUTO_UPGRADE:-}'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  redis-cache:
    image: redis:6.2-alpine
    pull_policy: always
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-queue:
    image: redis:6.2-alpine
    pull_policy: always
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  configurator:
    <<: *job
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      DB_HOST: '${DB_HOST:-db}'
      DB_PORT: '${DB_PORT:-3306}'
    command:
      - |
        set -Eeuo pipefail
        wait-for-it -t 180 "$${DB_HOST}:$${DB_PORT}"
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host "$${DB_HOST}"
        bench set-config -gp db_port "$${DB_PORT}"
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell

  create-site:
    <<: *job
    depends_on:
      configurator:
        condition: service_completed_successfully
    environment:
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'
      DB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
      SITE_NAME: '${SITE_NAME:?SITE_NAME is required}'
    command:
      - |
        set -Eeuo pipefail
        if [[ -d "sites/$${SITE_NAME}" ]]; then
          echo "Site $${SITE_NAME} already exists"
        else
          [[ -n "$${ADMIN_PASSWORD}" ]] || { echo 'ADMIN_PASSWORD is required when creating a new site' >&2; exit 64; }
          bench new-site \
            --mariadb-user-host-login-scope='%' \
            --admin-password="$${ADMIN_PASSWORD}" \
            --db-root-username=root \
            --db-root-password="$${DB_ROOT_PASSWORD}" \
            "$${SITE_NAME}"
        fi

  install-apps:
    <<: *job
    depends_on:
      create-site:
        condition: service_completed_successfully
    environment:
      SITE_NAME: '${SITE_NAME:?SITE_NAME is required}'
    command:
      - |
        set -Eeuo pipefail
        [[ -d "sites/$${SITE_NAME}" ]] || { echo "Site $${SITE_NAME} does not exist" >&2; exit 66; }
        for app in payments erpnext hrms; do
          if bench --site "$${SITE_NAME}" list-apps | grep -Eq "^$${app}([[:space:]]|$$)"; then
            echo "$${app} is already installed"
          else
            bench --site "$${SITE_NAME}" install-app "$${app}"
          fi
        done

  migrate:
    <<: *job
    depends_on:
      install-apps:
        condition: service_completed_successfully
    environment:
      SITE_NAME: '${SITE_NAME:?SITE_NAME is required}'
    command:
      - |
        set -Eeuo pipefail
        [[ -d "sites/$${SITE_NAME}" ]] || { echo "Site $${SITE_NAME} does not exist" >&2; exit 66; }

        migration_succeeded=0
        finish() {
          if [[ "$${migration_succeeded}" == 1 ]]; then
            bench --site "$${SITE_NAME}" set-config -p pause_scheduler 0
            bench --site "$${SITE_NAME}" set-config -p maintenance_mode 0
          else
            echo 'bench migrate failed; maintenance mode and scheduler pause remain enabled' >&2
          fi
        }
        trap finish EXIT

        echo 'Enabling maintenance mode and pausing the scheduler'
        bench --site "$${SITE_NAME}" set-config -p maintenance_mode 1
        bench --site "$${SITE_NAME}" set-config -p pause_scheduler 1

        echo 'Clearing caches from the previously deployed image'
        bench --site "$${SITE_NAME}" clear-cache

        echo 'Running site migration'
        bench --site "$${SITE_NAME}" migrate

        echo 'Clearing post-migration caches'
        bench --site "$${SITE_NAME}" clear-cache

        echo 'Installed applications after migration'
        bench --site "$${SITE_NAME}" list-apps
        migration_succeeded=1

  backend:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wait-for-it, '0.0.0.0:8000']
      interval: 5s
      timeout: 10s
      retries: 30

  websocket:
    <<: *app
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wait-for-it, '0.0.0.0:9000']
      interval: 5s
      timeout: 10s
      retries: 30

  frontend:
    <<: *app
    command:
      - bash
      - -c
      - |
        export FRAPPE_SITE_NAME_HEADER="$${SITE_NAME}"
        exec nginx-entrypoint.sh
    expose:
      - "8080"
    # ports:
    #   - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    environment:
      BACKEND: backend:8000
      SITE_NAME: '${SITE_NAME:?SITE_NAME is required}'
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
      PROXY_READ_TIMEOUT: '${PROXY_READ_TIMEOUT:-120}'
      CLIENT_MAX_BODY_SIZE: '${CLIENT_MAX_BODY_SIZE:-50m}'
      HTTPS: '${HTTPS:-on}'
      HTTP_X_FORWARDED_PROTO: '${HTTP_X_FORWARDED_PROTO:-https}'
      HTTP_X_FORWARDED_SSL: '${HTTP_X_FORWARDED_SSL:-on}'
      HTTP_X_FORWARDED_PORT: '${HTTP_X_FORWARDED_PORT:-443}'
      FORCE_SSL: '${FORCE_SSL:-1}'
    healthcheck:
      test: [CMD, wait-for-it, '0.0.0.0:8080']
      interval: 5s
      timeout: 30s
      retries: 30

  queue-default:
    <<: *app
    command: [bench, worker, --queue, default]
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue-short:
    <<: *app
    command: [bench, worker, --queue, short]
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue-long:
    <<: *app
    command: [bench, worker, --queue, long]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    command: [bench, schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: '${APP_IMAGE:?APP_IMAGE must be an immutable image tag or digest}'
    entrypoint: ["bash", "-c"]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    command:
      - |
        set -euo pipefail
 
        ENABLE_BACKUP="$${ENABLE_BACKUP:-false}"
 
        case "$${ENABLE_BACKUP}" in
          true|1|yes|on)
            ;;
          *)
            echo "========================================="
            echo "Backup is disabled."
            echo "Set ENABLE_BACKUP=true to enable."
            echo "========================================="
            exit 0
            ;;
        esac
 
        echo "Waiting for database..."
        wait-for-it -t 180 "$${DB_HOST:-db}:$${DB_PORT:-3306}"
 
        echo "Running Frappe backup..."
 
        bench --site all backup --with-files
 
        if ! restic cat config >/dev/null 2>&1; then
            echo "No Restic repository detected. Creating one..."
            restic init
        else
            echo "Restic repository found."
        fi
 
        restic backup /home/frappe/frappe-bench/sites
 
        restic forget \
          --group-by=paths \
          --keep-last=30 \
          --prune
 
        restic check
 
        echo "Backup completed successfully"
 
    environment:
      RESTIC_REPOSITORY: s3:https://s3.<region>.backblazeb2.com/<bucket>
      AWS_ACCESS_KEY_ID: ${B2_ACCOUNT_ID}
      AWS_SECRET_ACCESS_KEY: ${B2_ACCOUNT_KEY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      ENABLE_BACKUP: ${ENABLE_BACKUP:-false}
      DB_HOST: '${DB_HOST:-db}'
      DB_PORT: '${DB_PORT:-3306}'
 
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
 
  restore:
    image: "${APP_IMAGE:?APP_IMAGE must be an immutable image tag or digest}"
    user: root 
    entrypoint: ["bash", "-c"]
    restart: 'no'
 
    command:
      - |
        set -Eeuo pipefail
 
        ENABLE_RESTORE="$${ENABLE_RESTORE:-false}"
 
        case "$${ENABLE_RESTORE}" in
          true|1|yes|on)
            ;;
          *)
            echo "========================================="
            echo "Restore is disabled."
            echo "Set ENABLE_RESTORE=true to enable."
            echo "========================================="
            exit 0
            ;;
        esac
 
        SITE_NAME="$${SITE_NAME:-frontend}"
        SNAPSHOT="$${SNAPSHOT:-latest}"
 
        RESTORE_ROOT="/restore"
        SRC="$${RESTORE_ROOT}/home/frappe/frappe-bench/sites/$${SITE_NAME}"
 
        SITES_ROOT="/home/frappe/frappe-bench/sites"
        DST="$${SITES_ROOT}/$${SITE_NAME}"
        TMP="$${SITES_ROOT}/$${SITE_NAME}.tmp"
        BACKUP="$${SITES_ROOT}/$${SITE_NAME}.bak"
 
        rollback() {
          echo
          echo "Restore failed."
 
          rm -rf "$${TMP}" || true
 
          if [ -d "$${BACKUP}" ] && [ ! -d "$${DST}" ]; then
            echo "Rolling back previous site..."
            mv "$${BACKUP}" "$${DST}"
          fi
        }
 
        trap rollback ERR
 
        echo "========================================="
        echo "Restic Restore"
        echo "Site      : $${SITE_NAME}"
        echo "Snapshot  : $${SNAPSHOT}"
        echo "========================================="
 
        echo
        echo "Checking repository..."
        restic cat config >/dev/null
 
        echo "Checking snapshot..."
        restic ls "$${SNAPSHOT}" >/dev/null
 
        echo "Preparing restore directory..."
        rm -rf "$${RESTORE_ROOT}"
        mkdir -p "$${RESTORE_ROOT}"
 
        echo "Downloading snapshot..."
        restic restore "$${SNAPSHOT}" \
          --target "$${RESTORE_ROOT}"
 
        if [ ! -d "$${SRC}" ]; then
          echo "ERROR: Site '$${SITE_NAME}' not found in snapshot."
          exit 1
        fi
 
        if [ ! -f "$${SRC}/site_config.json" ]; then
          echo "ERROR: site_config.json missing."
          exit 1
        fi
 
        mkdir -p "$${SITES_ROOT}"
 
        rm -rf "$${TMP}"
        rm -rf "$${BACKUP}"
 
        echo
        echo "Copying restored site..."
        cp -a "$${SRC}" "$${TMP}"
 
        if [ ! -f "$${TMP}/site_config.json" ]; then
          echo "ERROR: Temporary copy validation failed."
          exit 1
        fi
 
        chown -R frappe:frappe "$${TMP}"
 
        if [ -d "$${DST}" ]; then
          echo
          echo "Backing up existing site..."
          mv "$${DST}" "$${BACKUP}"
        fi
 
        echo "Activating restored site..."
        mv "$${TMP}" "$${DST}"
 
        if [ ! -f "$${DST}/site_config.json" ]; then
          echo "ERROR: Final validation failed."
          exit 1
        fi
 
        echo "$(date -Iseconds) Snapshot=$${SNAPSHOT}" \
          > "$${DST}/.restore-info"
 
        rm -rf "$${BACKUP}"
        rm -rf "$${RESTORE_ROOT}"
 
        trap - ERR
 
        echo
        echo "========================================="
        echo "Restore completed successfully."
        echo "Site      : $${SITE_NAME}"
        echo "Snapshot  : $${SNAPSHOT}"
        echo "========================================="
 
    environment:
      ENABLE_RESTORE: ${ENABLE_RESTORE:-false}
      RESTIC_REPOSITORY: s3:https://<account>.r2.cloudflarestorage.com/<bucket>
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${B2_ACCOUNT_ID}
      AWS_SECRET_ACCESS_KEY: ${B2_ACCOUNT_KEY}
 
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
 
  restore-db:
    image: '${APP_IMAGE:?APP_IMAGE must be an immutable image tag or digest}'
    user: frappe
    entrypoint: ["bash", "-c"]
    restart: 'no'
    # profiles: ["restore"]
    depends_on:
      restore:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      SITE_NAME: '${SITE_NAME:-frontend}'
      ENABLE_DB_RESTORE: ${ENABLE_DB_RESTORE:-false}
      DB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
      DB_HOST: '${DB_HOST:-db}'
      DB_PORT: '${DB_PORT:-3306}'
    command:
      - |
        set -Eeuo pipefail
 
        ENABLE_DB_RESTORE="$${ENABLE_DB_RESTORE:-false}"
 
        case "$${ENABLE_DB_RESTORE}" in
          true|1|yes|on)
            ;;
          *)
            echo "========================================="
            echo "DB Restore is disabled."
            echo "Set ENABLE_DB_RESTORE=true to enable."
            echo "========================================="
            exit 0
            ;;
        esac
 
        echo "Waiting for database..."
        wait-for-it -t 180 "$${DB_HOST}:$${DB_PORT}"
 
        BACKUP_DIR="sites/$${SITE_NAME}/private/backups"
 
        echo "========================================="
        echo "Database Restore"
        echo "Site : $${SITE_NAME}"
        echo "========================================="
 
        DB_FILE=$(ls -1 "$${BACKUP_DIR}"/*-"$${SITE_NAME}"-database.sql.gz | sort | tail -n1)
        PUBLIC_FILE=$(ls -1 "$${BACKUP_DIR}"/*-"$${SITE_NAME}"-files.tar 2>/dev/null | sort | tail -n1 || true)
        PRIVATE_FILE=$(ls -1 "$${BACKUP_DIR}"/*-"$${SITE_NAME}"-private-files.tar 2>/dev/null | sort | tail -n1 || true)
 
        if [[ -z "$${DB_FILE}" ]]; then
          echo "ERROR: No database backup found in $${BACKUP_DIR}" >&2
          exit 1
        fi
 
        echo "Using database backup : $${DB_FILE}"
        echo "Using public files    : $${PUBLIC_FILE:-none}"
        echo "Using private files   : $${PRIVATE_FILE:-none}"
 
        RESTORE_ARGS=("$${DB_FILE}" --db-root-username root --db-root-password "$${DB_ROOT_PASSWORD}")
        [[ -n "$${PUBLIC_FILE}" ]] && RESTORE_ARGS+=(--with-public-files "$${PUBLIC_FILE}")
        [[ -n "$${PRIVATE_FILE}" ]] && RESTORE_ARGS+=(--with-private-files "$${PRIVATE_FILE}")
 
        bench --site "$${SITE_NAME}" restore "$${RESTORE_ARGS[@]}"
        bench --site "$${SITE_NAME}" enable-scheduler
        bench --site "$${SITE_NAME}" migrate
 
        echo
        echo "Database restore + migrate completed successfully."
 
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
 
volumes:
  db-data:
    name: '${DB_VOLUME_NAME:?DB_VOLUME_NAME is required}'
  redis-cache-data:
    name: '${REDIS_CACHE_VOLUME_NAME:?REDIS_CACHE_VOLUME_NAME is required}'
  redis-queue-data:
    name: '${REDIS_QUEUE_VOLUME_NAME:?REDIS_QUEUE_VOLUME_NAME is required}'
  sites:
    name: '${SITES_VOLUME_NAME:?SITES_VOLUME_NAME is required}'
  logs:
    name: '${LOGS_VOLUME_NAME:?LOGS_VOLUME_NAME is required}'
