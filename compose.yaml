x-app: &app
  image: '${APP_IMAGE:?APP_IMAGE must be an immutable image tag or digest}'
  pull_policy: always
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-job: &job
  image: '${APP_IMAGE:?APP_IMAGE must be an immutable image tag or digest}'
  pull_policy: always
  restart: 'no'
  exclude_from_hc: true
  entrypoint: [bash, -lc]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: '${DB_IMAGE:?DB_IMAGE is required}'
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 2m
    deploy:
      mode: replicated
      replicas: '${ENABLE_DB:?Set ENABLE_DB to 0 for an external database or 1 for the Compose database}'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
      MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
      MARIADB_AUTO_UPGRADE: '${MARIADB_AUTO_UPGRADE:-}'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  redis-cache:
    image: redis:6.2-alpine
    pull_policy: always
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-queue:
    image: redis:6.2-alpine
    pull_policy: always
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  configurator:
    <<: *job
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      DB_HOST: '${DB_HOST:-db}'
      DB_PORT: '${DB_PORT:-3306}'
    command:
      - |
        set -Eeuo pipefail
        wait-for-it -t 180 "$${DB_HOST}:$${DB_PORT}"
        wait-for-it -t 120 redis-cache:6379
        wait-for-it -t 120 redis-queue:6379
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host "$${DB_HOST}"
        bench set-config -gp db_port "$${DB_PORT}"
        bench set-config -g redis_cache redis://redis-cache:6379
        bench set-config -g redis_queue redis://redis-queue:6379
        bench set-config -g redis_socketio redis://redis-queue:6379
        bench set-config -gp socketio_port 9000
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell

  create-site:
    <<: *job
    depends_on:
      configurator:
        condition: service_completed_successfully
    environment:
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-}'
      DB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}'
      SITE_NAME: '${SITE_NAME:?SITE_NAME is required}'
    command:
      - |
        set -Eeuo pipefail
        if [[ -d "sites/$${SITE_NAME}" ]]; then
          echo "Site $${SITE_NAME} already exists"
          exit 0
        fi
        [[ -n "$${ADMIN_PASSWORD}" ]] || { echo 'ADMIN_PASSWORD is required when creating a new site' >&2; exit 64; }
        bench new-site \
          --mariadb-user-host-login-scope='%' \
          --admin-password="$${ADMIN_PASSWORD}" \
          --db-root-username=root \
          --db-root-password="$${DB_ROOT_PASSWORD}" \
          "$${SITE_NAME}"

  install-apps:
    <<: *job
    depends_on:
      create-site:
        condition: service_completed_successfully
    environment:
      SITE_NAME: '${SITE_NAME:?SITE_NAME is required}'
    command:
      - |
        set -Eeuo pipefail
        [[ -d "sites/$${SITE_NAME}" ]] || { echo "Site $${SITE_NAME} does not exist" >&2; exit 66; }
        for app in payments erpnext hrms; do
          if bench --site "$${SITE_NAME}" list-apps | grep -Eq "^$${app}([[:space:]]|$$)"; then
            echo "$${app} is already installed"
          else
            bench --site "$${SITE_NAME}" install-app "$${app}"
          fi
        done

  migrate:
    <<: *job
    depends_on:
      install-apps:
        condition: service_completed_successfully
    environment:
      SITE_NAME: '${SITE_NAME:?SITE_NAME is required}'
    command:
      - |
        set -Eeuo pipefail
        [[ -d "sites/$${SITE_NAME}" ]] || { echo "Site $${SITE_NAME} does not exist" >&2; exit 66; }

        migration_succeeded=0
        finish() {
          if [[ "$${migration_succeeded}" == 1 ]]; then
            bench --site "$${SITE_NAME}" set-config -p pause_scheduler 0
            bench --site "$${SITE_NAME}" set-config -p maintenance_mode 0
          else
            echo 'bench migrate failed; maintenance mode and scheduler pause remain enabled' >&2
          fi
        }
        trap finish EXIT

        bench --site "$${SITE_NAME}" set-config -p maintenance_mode 1
        bench --site "$${SITE_NAME}" set-config -p pause_scheduler 1
        bench --site "$${SITE_NAME}" migrate
        bench --site "$${SITE_NAME}" clear-cache
        bench --site "$${SITE_NAME}" list-apps
        migration_succeeded=1

  backend:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wait-for-it, '0.0.0.0:8000']
      interval: 5s
      timeout: 10s
      retries: 30

  websocket:
    <<: *app
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wait-for-it, '0.0.0.0:9000']
      interval: 5s
      timeout: 10s
      retries: 30

  frontend:
    <<: *app
    command: [nginx-entrypoint.sh]
    expose:
      - '8080'
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: '${FRAPPE_SITE_NAME_HEADER:-$$host}'
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
      PROXY_READ_TIMEOUT: '${PROXY_READ_TIMEOUT:-120}'
      CLIENT_MAX_BODY_SIZE: '${CLIENT_MAX_BODY_SIZE:-50m}'
      HTTPS: '${HTTPS:-on}'
      HTTP_X_FORWARDED_PROTO: '${HTTP_X_FORWARDED_PROTO:-https}'
      HTTP_X_FORWARDED_SSL: '${HTTP_X_FORWARDED_SSL:-on}'
      HTTP_X_FORWARDED_PORT: '${HTTP_X_FORWARDED_PORT:-443}'
      FORCE_SSL: '${FORCE_SSL:-1}'
    healthcheck:
      test: [CMD, wait-for-it, '0.0.0.0:8080']
      interval: 5s
      timeout: 30s
      retries: 30

  queue-default:
    <<: *app
    command: [bench, worker, --queue, default]
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue-short:
    <<: *app
    command: [bench, worker, --queue, short]
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue-long:
    <<: *app
    command: [bench, worker, --queue, long]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    command: [bench, schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
    name: '${DB_VOLUME_NAME:?DB_VOLUME_NAME is required}'
  redis-cache-data:
    name: '${REDIS_CACHE_VOLUME_NAME:?REDIS_CACHE_VOLUME_NAME is required}'
  redis-queue-data:
    name: '${REDIS_QUEUE_VOLUME_NAME:?REDIS_QUEUE_VOLUME_NAME is required}'
  sites:
    name: '${SITES_VOLUME_NAME:?SITES_VOLUME_NAME is required}'
  logs:
    name: '${LOGS_VOLUME_NAME:?LOGS_VOLUME_NAME is required}'
