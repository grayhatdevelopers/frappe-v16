name: Release

# Merging the develop -> main pull request releases whatever fix/feat commits it brings.
on:
  push:
    branches: [main]

permissions: {}

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # To tag the image that develop built and tested with the version.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save semantic-release@25 @semantic-release/git@11 @semantic-release/exec@7
      - name: Release
        env:
          # Pushes the version bump past main's pull request rule, so it must be an admin's token.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
