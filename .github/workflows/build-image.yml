name: Image

# Builds the image once per change to build/, then deploys it with Compose.
# Documentation-only pull requests and the develop -> main pull request skip it.
# The image is published under a tag named after build/, which develop also tags :develop
# and a release tags with its version and :latest (see release.yml).
# Pull requests from forks publish nothing.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only pull requests skip the image job; a skipped job reports as passed,
  # so the required check does not leave the pull request waiting.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
              files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
              grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    # develop's own push already checked the commit the develop -> main pull request brings.
    if: >-
      needs.changes.outputs.code == 'true' &&
      !(github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/local/share/boost /usr/share/dotnet

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Reuses the image when these build files were already built.
      - name: Find the image
        env:
          PUBLISH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          image=$(scripts/image_ref.sh)
          build=true
          docker buildx imagetools inspect "$image" > /dev/null && build=false
          # Each app set has its own cache, so builds of different app sets stop overwriting
          # each other's; develop's own cache fills in whatever a new app set lacks.
          cache="ghcr.io/${GITHUB_REPOSITORY}:buildcache"
          apps_cache="$cache-$(sha256sum build/apps.json | cut -c1-12)"
          {
              echo "IMAGE=$image"
              echo "BUILD=$build"
              echo 'CACHE_FROM<<EOF'
              echo "type=registry,ref=$apps_cache"
              echo "type=registry,ref=$cache"
              echo 'EOF'
              echo 'CACHE_TO<<EOF'
              [ "$PUBLISH" = true ] && echo "type=registry,ref=$apps_cache,mode=max"
              [ "$GITHUB_EVENT_NAME" = push ] && echo "type=registry,ref=$cache,mode=max"
              echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Read Frappe and frappe_docker versions
        if: env.BUILD == 'true'
        run: |
          grep -E '^[A-Z_]+=' build/frappe.env >> "$GITHUB_ENV"
          # frappe_docker tags frappe/build with ERPNext's version and frappe/base with Frappe's,
          # while the Containerfile looks up both by Frappe's; their versions differ.
          echo "ERPNEXT_REF=$(jq -r '.[] | select(.url == "https://github.com/frappe/erpnext") | .branch' build/apps.json)" >> "$GITHUB_ENV"

      - name: Checkout frappe_docker
        if: env.BUILD == 'true'
        uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: builder
          persist-credentials: false

      # The image has no .git directories; record the commit behind each ref.
      - name: Resolve source commits
        if: env.BUILD == 'true'
        run: |
          {
              echo '| Source | Ref | Commit |'
              echo '| --- | --- | --- |'
              echo "| frappe/frappe_docker | | ${FRAPPE_DOCKER_REF} |"
              { printf 'https://github.com/frappe/frappe\t%s\n' "$FRAPPE_REF"; jq -r '.[] | [.url, .branch] | @tsv' build/apps.json; } |
              while IFS=$'\t' read -r url ref; do
                  # Prefer a dereferenced annotated tag over the tag object itself.
                  sha=$(git ls-remote "$url" "refs/heads/$ref" "refs/tags/$ref" "refs/tags/$ref^{}" |
                      awk '!first { first = $1 } /\^\{\}$/ { peeled = $1 } END { print peeled ? peeled : first }')
                  [ -n "$sha" ] || { echo "::error::No ref $ref in $url"; exit 1; }
                  echo "| ${url#https://github.com/} | $ref | $sha |"
              done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4
        if: env.BUILD == 'true'

      - name: Build
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v7
        with:
          context: builder
          file: builder/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
            CACHE_BUST=${{ hashFiles('build/apps.json') }}
          # apps.json is a secret mount, which the layer cache ignores; CACHE_BUST rebuilds on change.
          secret-files: apps_json=build/apps.json
          build-contexts: frappe/build:${{ env.FRAPPE_REF }}=docker-image://frappe/build:${{ env.ERPNEXT_REF }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: ${{ env.CACHE_FROM }}
          cache-to: ${{ env.CACHE_TO }}
          platforms: linux/amd64
          load: true
          tags: frappe-v16-layered

      # The local image daemon's builder, since the layered image above was only loaded there.
      - name: Record the revision
        if: env.BUILD == 'true'
        run: >-
          docker buildx build --builder default --load
          --build-arg SOURCE_COMMIT="$(git rev-parse HEAD:build)"
          --file build/Containerfile --tag "$IMAGE" build

      - name: Check apps and tools
        if: env.BUILD == 'true'
        run: |
          # Frappe and every app in apps.json load and report a version.
          docker run --rm --entrypoint bench "$IMAGE" version --format json | tee versions.json
          jq -e --slurpfile apps build/apps.json 'length == ($apps[0] | length) + 1 and all(.version)' versions.json
          # frappe_restic's deploy, restore and runtime guard need these.
          docker run --rm --entrypoint bash "$IMAGE" -c 'restic version && flock --version && jq --version'
          # frappe_restic tags backups with the revision the image carries.
          docker run --rm --entrypoint env/bin/python "$IMAGE" -c \
              'from frappe_restic.restic_backup.restic_transport import release_identity; print(release_identity())' |
              tee revision
          [ "$(cat revision)" = "$(git rev-parse HEAD:build)" ]

      # A new site, then a redeploy that backs it up and migrates it, as Coolify deploys.
      - name: Deploy and redeploy with Compose
        env:
          APP_IMAGE: ${{ env.IMAGE }}
        run: |
          # One service pulls the image; parallel pulls of it can fill the disk.
          docker compose --env-file .env.example config --format json |
              jq -e '[.services[] | select(.image == env.APP_IMAGE and .pull_policy != "never")] | length == 1'
          docker compose --env-file .env.example up -d --wait --wait-timeout 900
          docker compose --env-file .env.example stop
          docker compose --env-file .env.example up -d --wait --wait-timeout 900
          # The redeploy's backup records the release the site ran and the one replacing it.
          docker compose --env-file .env.example exec -T backend bash -c \
              'jq -c "{release_identity, incoming_release}" "$(ls -t sites/*/private/deployment-backups/*/backup-control.json | head -1)"' |
              tee releases.json
          jq -e --arg revision "$(git rev-parse HEAD:build)" 'all(.[]; . == $revision)' releases.json

      - name: Compose logs
        if: failure()
        env:
          APP_IMAGE: ${{ env.IMAGE }}
        run: docker compose --env-file .env.example logs --no-color

      # Publishes the image that was just checked.
      - name: Publish
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # Another run may have published these build files meanwhile; keep the first image.
          if [ "$BUILD" = true ] && ! docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
              docker push "$IMAGE"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY}:develop" "$IMAGE"
          fi
