name: Image

# Pull requests check the image and deploy it with Compose; a release tag also publishes it.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The image is built only from build/ and this workflow; pull requests that change neither
  # test the latest release instead, or build it when there is none.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
      release: ${{ steps.files.outputs.release }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          build=true
          if [ -n "$PR" ]; then
              files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
              if ! grep -qE '^build/|^\.github/workflows/build-image\.yml$' <<< "$files" &&
                  release=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName); then
                  build=false
                  echo "release=$release" >> "$GITHUB_OUTPUT"
              fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ needs.changes.outputs.release || (github.ref_type == 'tag' && github.ref_name) || 'test' }}
      BUILD: ${{ needs.changes.outputs.build }}
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android /usr/local/share/boost /usr/share/dotnet

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read Frappe and frappe_docker versions
        if: env.BUILD == 'true'
        run: grep -E '^[A-Z_]+=' build/frappe.env >> "$GITHUB_ENV"

      - name: Checkout frappe_docker
        if: env.BUILD == 'true'
        uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: builder
          persist-credentials: false

      # The image has no .git directories; record the commit behind each ref.
      - name: Resolve source commits
        if: env.BUILD == 'true'
        run: |
          {
              echo '| Source | Ref | Commit |'
              echo '| --- | --- | --- |'
              echo "| frappe/frappe_docker | | ${FRAPPE_DOCKER_REF} |"
              { printf 'https://github.com/frappe/frappe\t%s\n' "$FRAPPE_REF"; jq -r '.[] | [.url, .branch] | @tsv' build/apps.json; } |
              while IFS=$'\t' read -r url ref; do
                  # Prefer a dereferenced annotated tag over the tag object itself.
                  sha=$(git ls-remote "$url" "refs/heads/$ref" "refs/tags/$ref" "refs/tags/$ref^{}" |
                      awk '!first { first = $1 } /\^\{\}$/ { peeled = $1 } END { print peeled ? peeled : first }')
                  [ -n "$sha" ] || { echo "::error::No ref $ref in $url"; exit 1; }
                  echo "| ${url#https://github.com/} | $ref | $sha |"
              done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4
        if: env.BUILD == 'true'

      - name: Build
        if: env.BUILD == 'true'
        uses: docker/build-push-action@v7
        with:
          context: builder
          file: builder/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
            CACHE_BUST=${{ hashFiles('build/apps.json') }}
          # apps.json is a secret mount, which the layer cache ignores; CACHE_BUST rebuilds on change.
          secret-files: apps_json=build/apps.json
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frappe-v16
          cache-to: type=gha,mode=max,scope=frappe-v16
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}

      # To pull the latest release, or to publish one.
      - name: Log in to GHCR
        if: github.ref_type == 'tag' || env.BUILD != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check apps and tools
        if: env.BUILD == 'true'
        run: |
          # Frappe and every app in apps.json load and report a version.
          docker run --rm --entrypoint bench "$IMAGE" version --format json | tee versions.json
          jq -e --slurpfile apps build/apps.json 'length == ($apps[0] | length) + 1 and all(.version)' versions.json
          # frappe_restic's deploy, restore and runtime guard need these.
          docker run --rm --entrypoint bash "$IMAGE" -c 'restic version && flock --version && jq --version'

      # A new site, then a redeploy that backs it up and migrates it, as Coolify deploys.
      - name: Deploy and redeploy with Compose
        env:
          APP_IMAGE: ${{ env.IMAGE }}
        run: |
          docker compose --env-file .env.example up -d --wait --wait-timeout 900
          docker compose --env-file .env.example stop
          docker compose --env-file .env.example up -d --wait --wait-timeout 900

      - name: Compose logs
        if: failure()
        env:
          APP_IMAGE: ${{ env.IMAGE }}
        run: docker compose --env-file .env.example logs --no-color

      # Pushes the image that was just checked.
      - name: Publish
        if: github.ref_type == 'tag'
        run: docker push "$IMAGE"
