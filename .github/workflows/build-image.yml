name: Build Frappe v16 image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable release tag, for example v16-2026-07-16.1
        required: true
        type: string
      publish:
        description: Push the image to GHCR after the smoke test
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: frappe-v16-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILDER_DIR: builder
      FRAPPE_DOCKER_REF: c004361e790125ed13aaa933d11f7838711a8960
      FRAPPE_REF: v16.27.0
      CACHE_SCOPE: frappe-v16
      APPS_JSON_PATH: ${{ github.workspace }}/build/apps.json
      TEST_IMAGE: local/frappe-v16:${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      - name: Checkout deployment repository
        uses: actions/checkout@v7

      - name: Checkout official Frappe Docker builder
        uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: ${{ env.BUILDER_DIR }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          [[ "${REQUESTED_TAG}" =~ ^v16-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]]
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${owner}/frappe-v16" >> "${GITHUB_ENV}"
          apps_cache_key="$(sha256sum "${APPS_JSON_PATH}" | cut -d ' ' -f 1)"
          echo "APPS_CACHE_KEY=${apps_cache_key}" >> "${GITHUB_ENV}"

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILDER_DIR }}
          file: ${{ env.BUILDER_DIR }}/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
            CACHE_BUST=${{ env.APPS_CACHE_KEY }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          load: true
          platforms: linux/amd64
          secret-files: |
            apps_json=${{ env.APPS_JSON_PATH }}
          tags: ${{ env.TEST_IMAGE }}

      - name: Verify image contents
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint bench "${TEST_IMAGE}" version --format json | tee /tmp/bench-versions.json
          jq -e '
            (map(.app) | sort) as $apps
            | ["erpnext", "frappe", "hrms", "payments", "frappe_assistant_core", "overtime_management"]
              | all(. as $app | $apps | index($app))
          ' /tmp/bench-versions.json
          jq -e '
            ["frappe", "erpnext", "hrms"] as $v16_apps
            | all(.[]; . as $app
                | $v16_apps
                | index($app.app) == null or ($app.version | startswith("16.")))
          ' /tmp/bench-versions.json

      - name: Remove smoke-test image
        run: docker image rm "${TEST_IMAGE}"

      - name: Login to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish image
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILDER_DIR }}
          file: ${{ env.BUILDER_DIR }}/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
            CACHE_BUST=${{ env.APPS_CACHE_KEY }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          platforms: linux/amd64
          push: true
          secret-files: |
            apps_json=${{ env.APPS_JSON_PATH }}
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
