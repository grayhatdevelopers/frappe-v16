name: Build Frappe v16 image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable release tag, for example v16-2026-07-16.1
        required: true
        type: string
      publish:
        description: Push the image to GHCR after the smoke test
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: frappe-v16-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILDER_DIR: builder
      FRAPPE_DOCKER_REF: c004361e790125ed13aaa933d11f7838711a8960
      FRAPPE_REF: v16.27.0
      CACHE_SCOPE: frappe-v16
      APPS_JSON_PATH: ${{ github.workspace }}/build/apps.json
      TEST_IMAGE: local/frappe-v16:${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Free runner disk space
        run: |
          set -Eeuo pipefail

          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet

          df -h /

      - name: Checkout deployment repository
        uses: actions/checkout@v7

      - name: Checkout official Frappe Docker builder
        uses: actions/checkout@v7
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: ${{ env.BUILDER_DIR }}

      - name: Resolve source commits
        shell: bash
        run: |
          set -Eeuo pipefail

          OUTPUT_FILE="${GITHUB_WORKSPACE}/source-revisions.txt"

          echo "============================================================" | tee "${OUTPUT_FILE}"
          echo "RESOLVED SOURCE COMMITS" | tee -a "${OUTPUT_FILE}"
          echo "============================================================" | tee -a "${OUTPUT_FILE}"

          echo | tee -a "${OUTPUT_FILE}"

          # ----------------------------------------------------------
          # Resolve a Git ref to an exact SHA.
          #
          # Works with:
          #   - branches
          #   - lightweight tags
          #   - annotated tags
          #   - full commit SHAs
          # ----------------------------------------------------------
          resolve_ref() {
            local repo="$1"
            local ref="$2"

            local sha=""
            local commit_message=""

            echo "Repository: ${repo}" | tee -a "${OUTPUT_FILE}"
            echo "Requested:  ${ref}" | tee -a "${OUTPUT_FILE}"

            # If the ref is already a full 40-character SHA,
            # use it directly.
            if [[ "${ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              sha="$(git ls-remote "${repo}" "${ref}" | awk 'NR==1 {print $1}')"

              if [ -z "${sha}" ]; then
                sha="${ref}"
              fi
            else
              # First try branch.
              sha="$(
                git ls-remote "${repo}" "refs/heads/${ref}" \
                  | awk 'NR==1 {print $1}'
              )"

              # If it isn't a branch, try tag.
              if [ -z "${sha}" ]; then
                sha="$(
                  git ls-remote "${repo}" "refs/tags/${ref}^{}" \
                    | awk 'NR==1 {print $1}'
                )"
              fi

              # Lightweight tag.
              if [ -z "${sha}" ]; then
                sha="$(
                  git ls-remote "${repo}" "refs/tags/${ref}" \
                    | awk 'NR==1 {print $1}'
                )"
              fi
            fi

            if [ -z "${sha}" ]; then
              echo "ERROR: Could not resolve ${repo}@${ref}" | tee -a "${OUTPUT_FILE}"
              return 1
            fi

            # Get commit message without cloning the repository.
            #
            # git ls-remote gives us the SHA, but not the commit
            # subject. Use git fetch into a temporary repository.
            local temp_dir
            temp_dir="$(mktemp -d)"

            git -C "${temp_dir}" init -q
            git -C "${temp_dir}" remote add origin "${repo}"

            if ! git -C "${temp_dir}" fetch \
              --quiet \
              --depth=1 \
              origin "${sha}"; then

              echo "ERROR: Could not fetch commit ${sha} from ${repo}" \
                | tee -a "${OUTPUT_FILE}"

              rm -rf "${temp_dir}"
              return 1
            fi

            commit_message="$(
              git -C "${temp_dir}" show \
                -s \
                --format='%s' \
                FETCH_HEAD
            )"

            rm -rf "${temp_dir}"

            echo "Commit SHA: ${sha}" | tee -a "${OUTPUT_FILE}"
            echo "Commit:     ${commit_message}" | tee -a "${OUTPUT_FILE}"
            echo | tee -a "${OUTPUT_FILE}"
          }

          # ----------------------------------------------------------
          # Deployment repository
          # ----------------------------------------------------------

          echo "=== Deployment repository ===" | tee -a "${OUTPUT_FILE}"
          echo "Repository: ${GITHUB_REPOSITORY}" | tee -a "${OUTPUT_FILE}"
          echo "Commit SHA: $(git rev-parse HEAD)" | tee -a "${OUTPUT_FILE}"
          echo "Commit:     $(git log -1 --format='%s')" | tee -a "${OUTPUT_FILE}"
          echo | tee -a "${OUTPUT_FILE}"

          # ----------------------------------------------------------
          # frappe_docker
          # ----------------------------------------------------------

          echo "=== frappe/frappe_docker ===" | tee -a "${OUTPUT_FILE}"
          echo "Repository: https://github.com/frappe/frappe_docker" | tee -a "${OUTPUT_FILE}"
          echo "Requested:  ${FRAPPE_DOCKER_REF}" | tee -a "${OUTPUT_FILE}"
          echo "Checked:    $(git -C "${BUILDER_DIR}" rev-parse HEAD)" | tee -a "${OUTPUT_FILE}"
          echo "Commit:     $(git -C "${BUILDER_DIR}" log -1 --format='%s')" | tee -a "${OUTPUT_FILE}"
          echo | tee -a "${OUTPUT_FILE}"

          # ----------------------------------------------------------
          # Frappe
          # ----------------------------------------------------------

          echo "=== frappe/frappe ===" | tee -a "${OUTPUT_FILE}"

          resolve_ref \
            "https://github.com/frappe/frappe.git" \
            "${FRAPPE_REF}"

          # ----------------------------------------------------------
          # Apps from apps.json
          # ----------------------------------------------------------

          echo "=== Apps from apps.json ===" | tee -a "${OUTPUT_FILE}"

          if [ ! -f "${APPS_JSON_PATH}" ]; then
            echo "ERROR: apps.json not found at ${APPS_JSON_PATH}" \
              | tee -a "${OUTPUT_FILE}"
            exit 1
          fi

          echo "apps.json:" | tee -a "${OUTPUT_FILE}"
          cat "${APPS_JSON_PATH}" | tee -a "${OUTPUT_FILE}"
          echo | tee -a "${OUTPUT_FILE}"

          jq -e '
            type == "array"
            and all(.[]; has("url") and has("branch"))
          ' "${APPS_JSON_PATH}" > /dev/null

          while IFS=$'\t' read -r repo ref; do
            resolve_ref "${repo}" "${ref}"
          done < <(
            jq -r '.[] | [.url, .branch] | @tsv' "${APPS_JSON_PATH}"
          )

          echo "============================================================" | tee -a "${OUTPUT_FILE}"
          echo "END RESOLVED SOURCE COMMITS" | tee -a "${OUTPUT_FILE}"
          echo "============================================================" | tee -a "${OUTPUT_FILE}"

          echo
          echo "Full source revision report:"
          cat "${OUTPUT_FILE}"

      - name: Upload source revision report
        uses: actions/upload-artifact@v4
        with:
          name: source-revisions
          path: source-revisions.txt
          retention-days: 10

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set image name
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          [[ "${REQUESTED_TAG}" =~ ^v16-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]]
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${owner}/frappe-v16" >> "${GITHUB_ENV}"
          apps_cache_key="$(sha256sum "${APPS_JSON_PATH}" | cut -d ' ' -f 1)"
          echo "APPS_CACHE_KEY=${apps_cache_key}" >> "${GITHUB_ENV}"

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILDER_DIR }}
          file: ${{ env.BUILDER_DIR }}/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
            CACHE_BUST=${{ env.APPS_CACHE_KEY }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          load: true
          platforms: linux/amd64
          secret-files: |
            apps_json=${{ env.APPS_JSON_PATH }}
          tags: ${{ env.TEST_IMAGE }}

      - name: Verify image contents
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint bench "${TEST_IMAGE}" version --format json | tee /tmp/bench-versions.json
          jq -e '
            (map(.app) | sort) as $apps
            | ["erpnext", "frappe", "hrms", "payments", "frappe_assistant_core", "overtime_management", "frappe_restic"]
              | all(. as $app | $apps | index($app))
          ' /tmp/bench-versions.json
          jq -e '
            ["frappe", "erpnext", "hrms"] as $v16_apps
            | all(.[]; . as $app
                | $v16_apps
                | index($app.app) == null or ($app.version | startswith("16.")))
          ' /tmp/bench-versions.json
          # frappe_restic's deploy, restore and runtime guard need these.
          docker run --rm --entrypoint bash "${TEST_IMAGE}" -c 'restic version && flock --version && jq --version'

      - name: Remove smoke-test image
        run: docker image rm "${TEST_IMAGE}"

      - name: Login to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish image
        if: ${{ inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILDER_DIR }}
          file: ${{ env.BUILDER_DIR }}/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
            CACHE_BUST=${{ env.APPS_CACHE_KEY }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          platforms: linux/amd64
          push: true
          secret-files: |
            apps_json=${{ env.APPS_JSON_PATH }}
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
