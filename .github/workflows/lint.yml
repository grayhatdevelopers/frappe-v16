name: Lint

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Includes shellcheck for the workflows' run steps.
      - name: Workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Scripts
        run: shellcheck scripts/*.sh

      # Plain Docker Compose rejects keys it does not know, such as Coolify-only ones.
      - name: Compose file
        run: docker compose --env-file .env.example config --quiet
